name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install .
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy app

      - name: Tests with coverage
        run: python -m pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t orderflow-scale:${{ github.sha }} .

      - name: Smoke test image
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_URL=sqlite+aiosqlite:///./smoke.db \
            -e CACHE_BACKEND=memory \
            -e RATE_LIMIT_BACKEND=memory \
            -e UVICORN_WORKERS=1 \
            orderflow-scale:${{ github.sha }}
          sleep 15
          curl -f http://localhost:8000/health
          curl -f http://localhost:8000/metrics | grep -q http_requests_total
          docker logs api
